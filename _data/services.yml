# "What We Do" cards on the landing page. The honest breakdown.
- icon: "☾"
  title: Sleep
  text: >-
    Rule one of the job. Half our bugs fix themselves the second we close the
    laptop and go horizontal. We prefer to call that efficiency.

- icon: "zZ"
  title: Sleep. Again.
  text: >-
    If the first nap didn't crack it, take another. We tell people we're
    "thinking it through." Technically true, just with our eyes closed.

- icon: "❯"
  title: Hack
  text: >-
    Somewhere between naps we break something and screenshot the proof.
    Then we act like it took real effort, then post "we hack the planet."
