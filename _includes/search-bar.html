{%- comment -%} Search bar on /blog/ — submits to the full /search/ page. {%- endcomment -%}
<form class="searchbar" action="{{ '/search/' | relative_url }}" method="get" role="search">
  <svg class="searchbar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <input type="search" name="q" class="searchbar__input"
         placeholder="{{ include.placeholder | default: 'Search articles…' }}"
         aria-label="Search articles" autocomplete="off">
  <kbd class="searchbar__kbd">⏎</kbd>
</form>
