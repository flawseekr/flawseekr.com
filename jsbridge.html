<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JS Bridge Sniper</title>
<style>
:root{--bg:#101014;--fg:#9a9a9a;--fg2:#686868;--hi:#c9b458;--danger:#c44;--safe:#5a7a5a;--surface:#16161a;--rule:#1e1e24;--code:#b0b0b0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:11px/1.65 Menlo,'DejaVu Sans Mono',Consolas,monospace;padding:10px 12px;overflow-x:hidden}
.header{padding:0 0 7px;margin:0 0 8px;border-bottom:1px solid var(--rule)}
.header h1{font-size:11px;font-weight:400;color:var(--fg2);letter-spacing:1px}
.header h1 b{color:var(--hi);font-weight:700}
.header p{font-size:9px;color:var(--fg2);margin-top:1px}
.summary{display:flex;gap:12px;margin:0 0 8px;font-size:10px;color:var(--fg2);flex-wrap:wrap}
.summary em{font-style:normal;color:var(--fg)}
.summary .alert em{color:var(--danger);font-weight:700}
#scan-status{color:var(--fg2);padding:16px 0;font-size:10px}
.finding{margin:0 0 1px;background:var(--surface)}
.finding-header{padding:5px 8px;display:flex;align-items:baseline;gap:5px;cursor:pointer;user-select:none;border-left:2px solid var(--rule)}
.finding-header:hover{background:var(--bg)}
.finding.is-bridge .finding-header{border-left-color:var(--danger)}
.finding.is-native .finding-header{border-left-color:var(--hi)}
.finding .severity{font-size:8px;padding:0 4px;color:var(--bg);font-weight:700;letter-spacing:.5px;flex-shrink:0}
.finding.is-bridge .severity{background:var(--danger)}
.finding.is-native .severity{background:var(--hi)}
.finding.is-safe .severity{background:transparent;padding:0;width:0}
.finding .property-name{color:var(--code);flex:1;word-break:break-all}
.finding.is-bridge .property-name{color:#e8e8e8}
.finding .property-type{color:var(--fg2);font-size:10px;margin-left:auto;flex-shrink:0}
.finding-detail{padding:4px 8px 4px 12px;border-top:1px solid var(--rule);font-size:10px;display:none;background:var(--bg)}
.finding.open .finding-detail{display:block}
.finding-detail .entry{padding:1px 0;display:flex;gap:4px;min-height:14px}
.finding-detail .entry-key{color:var(--hi);min-width:70px;flex-shrink:0;opacity:.8}
.finding-detail .entry-value{color:var(--fg);word-break:break-all}
.finding-detail .entry-value.is-native-code{color:var(--danger);font-weight:600}
.finding-detail .entry-value.is-function{color:#8888bb}
.timestamp{margin-top:8px;font-size:9px;color:var(--fg2);border-top:1px solid var(--rule);padding-top:6px}
</style>

<div class="header">
  <h1>JavaScript Bridge <b>Sniper</b></h1>
  <p>Enumerates non-default window properties and detects native bridge interfaces</p>
</div>
<div class="summary" id="scan-summary"></div>
<div id="scan-status">Scanning window properties...</div>
<div id="results"></div>
<div class="timestamp" id="scan-timestamp"></div>

<script>
(function(){
  setTimeout(scan, 600);

  function scan(){
    var baselineProperties = collectBaseline();
    var currentProperties = new Set();
    for(var key in window) currentProperties.add(key);
    try { Object.getOwnPropertyNames(window).forEach(function(key){ currentProperties.add(key) }) } catch(e){}

    var injectedKeys = [];
    currentProperties.forEach(function(key){ if(!baselineProperties.has(key)) injectedKeys.push(key) });
    injectedKeys.sort();

    var findings = injectedKeys.map(inspectProperty);
    var bridgeFindings = findings.filter(function(finding){ return finding.isBridge });

    renderSummary(baselineProperties.size, currentProperties.size, injectedKeys.length, bridgeFindings.length);
    renderFindings(findings);

    document.getElementById('scan-status').style.display = 'none';
    document.getElementById('scan-timestamp').textContent =
      'Scan completed at ' + new Date().toISOString() +
      ' — found ' + injectedKeys.length + ' injected properties, ' + bridgeFindings.length + ' native bridges';
  }

  function collectBaseline(){
    var properties = new Set();
    var frame = document.createElement('iframe');
    frame.style.display = 'none';
    document.documentElement.appendChild(frame);
    try {
      var frameWindow = frame.contentWindow;
      for(var key in frameWindow) properties.add(key);
      Object.getOwnPropertyNames(frameWindow).forEach(function(key){ properties.add(key) });
      var prototype = Object.getPrototypeOf(frameWindow);
      while(prototype){
        Object.getOwnPropertyNames(prototype).forEach(function(key){ properties.add(key) });
        prototype = Object.getPrototypeOf(prototype);
      }
    } catch(e){}
    try { document.documentElement.removeChild(frame) } catch(e){}
    if(properties.size < 200){
      for(var key in window){
        try {
          if(typeof window[key] === 'function' && String(window[key]).indexOf('[native code]') !== -1) properties.add(key);
        } catch(e){ properties.add(key) }
      }
    }
    return properties;
  }

  function inspectProperty(key){
    var result = {key:key, type:'unknown', value:null, isBridge:false, children:[]};
    try {
      var value = window[key];
      result.type = value === null ? 'null' : typeof value;
      if(value == null){ result.value = String(value); return result }
      if(result.type === 'function'){
        var source = String(value);
        result.value = source.substring(0, 200);
        result.isBridge = source.indexOf('[native code]') !== -1;
      } else if(result.type === 'object'){
        result.children = inspectChildren(value, 1);
        result.isBridge = result.children.some(function(child){
          return child.isNative || (child.children && child.children.some(function(nested){ return nested.isNative }));
        });
      } else {
        result.value = JSON.stringify(value).substring(0, 300);
      }
    } catch(error){ result.type = 'error'; result.value = error.message }
    return result;
  }

  function inspectChildren(object, depth){
    if(depth > 3 || !object) return [];
    var keys;
    try { keys = Object.getOwnPropertyNames(object) } catch(e){ return [] }
    if(keys.length > 50) keys = keys.slice(0, 50);
    return keys.map(function(key){
      var child = {key:key, type:'unknown', value:null, isNative:false, children:[]};
      try {
        var value = object[key];
        child.type = value === null ? 'null' : typeof value;
        if(child.type === 'function'){
          var source = String(value);
          child.value = source.substring(0, 150);
          child.isNative = source.indexOf('[native code]') !== -1;
        } else if(child.type === 'object' && value !== null){
          child.children = inspectChildren(value, depth + 1);
          child.isNative = child.children.some(function(nested){ return nested.isNative });
        } else {
          try { child.value = JSON.stringify(value).substring(0, 150) } catch(e){ child.value = String(value) }
        }
      } catch(error){ child.type = 'error'; child.value = error.message }
      return child;
    });
  }

  function renderSummary(baselineCount, currentCount, injectedCount, bridgeCount){
    document.getElementById('scan-summary').innerHTML =
      '<div>Baseline <em>' + baselineCount + '</em></div>' +
      '<div>Current <em>' + currentCount + '</em></div>' +
      '<div class="' + (injectedCount ? 'alert' : '') + '">Injected <em>' + injectedCount + '</em></div>' +
      '<div class="' + (bridgeCount ? 'alert' : '') + '">Bridges <em>' + bridgeCount + '</em></div>';
  }

  function renderFindings(findings){
    findings.sort(function(a, b){ return (b.isBridge ? 1 : 0) - (a.isBridge ? 1 : 0) || a.key.localeCompare(b.key) });
    document.getElementById('results').innerHTML = findings.map(function(finding){
      var classification = finding.isBridge ? 'is-bridge' : 'is-safe';
      var severityLabel = finding.isBridge ? 'BRIDGE' : '';
      var detailContent = '';
      if(finding.value) detailContent += makeEntry('value', finding.value.substring(0, 300), '');
      if(finding.children.length) detailContent += renderChildEntries(finding.children, 0);
      return '<div class="finding ' + classification + '" onclick="this.classList.toggle(\'open\')">' +
        '<div class="finding-header"><span class="severity">' + severityLabel + '</span>' +
        '<span class="property-name">window.' + escapeHtml(finding.key) + '</span>' +
        '<span class="property-type">' + finding.type + '</span></div>' +
        '<div class="finding-detail">' + detailContent + '</div></div>';
    }).join('');
  }

  function renderChildEntries(children, depth){
    if(!children || !children.length) return '';
    var indent = Array(depth + 1).join('  ');
    return children.map(function(child){
      var valueClass = child.isNative ? 'is-native-code' : (child.type === 'function' ? 'is-function' : '');
      var displayValue = child.value || '';
      if(child.isNative) displayValue = '⚠ ' + displayValue.substring(0, 100);
      else if(child.type === 'function') displayValue = displayValue.substring(0, 100);
      return makeEntry(indent + '.' + child.key + (child.type === 'function' ? '()' : ''), displayValue, valueClass) +
        (child.children && child.children.length ? renderChildEntries(child.children, depth + 1) : '');
    }).join('');
  }

  function makeEntry(key, value, valueClass){
    return '<div class="entry"><span class="entry-key">' + escapeHtml(key) +
      '</span><span class="entry-value ' + valueClass + '">' + escapeHtml(value) + '</span></div>';
  }

  function escapeHtml(text){
    if(!text) return '';
    var container = document.createElement('div');
    container.appendChild(document.createTextNode(text));
    return container.innerHTML;
  }
})();
</script>
