<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JavaScript Bridge Detector</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --card: rgba(22, 27, 34, .7);
        --card-border: rgba(48, 54, 63, .5);
        --text: #c9d1d9;
        --text-dim: #484f58;
        --green: #3fb950;
        --blue: #58a6ff;
        --yellow: #e3b341;
        --purple: #bc8cff;
        --red: #f85149
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
      }

      body {
        font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px
      }

      /* glass film behind text — accessibility best practice for glassmorphism */
      .glass {
        background: var(--card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        border-radius: 16px
      }

      h1 {
        font-size: 20px;
        font-weight: 800;
        background: linear-gradient(135deg, #00b14f, #00d4aa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -.3px
      }

      .sub {
        color: var(--text-dim);
        font-size: 11px;
        margin-top: 2px
      }

      /* header */
      .header {
        padding: 20px 16px 16px;
        text-align: center
      }

      /* stats row */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 0 16px;
        margin-bottom: 16px
      }

      .stat {
        background: var(--card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 12px 8px;
        text-align: center;
        transition: transform .15s
      }

      .stat:active {
        transform: scale(.96)
      }

      .stat .num {
        font-size: 24px;
        font-weight: 800;
        line-height: 1
      }

      .stat .label {
        font-size: 9px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: .8px;
        margin-top: 4px
      }

      .stat.s-total .num {
        color: var(--text)
      }

      .stat.s-native .num {
        color: var(--green)
      }

      .stat.s-sdk .num {
        color: var(--blue)
      }

      .stat.s-other .num {
        color: var(--yellow)
      }

      /* bridge list */
      .list {
        padding: 0 16px 16px
      }

      .bridge {
        background: var(--card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        margin-bottom: 8px;
        overflow: hidden;
        transition: border-color .2s, box-shadow .2s
      }

      .bridge:hover {
        border-color: rgba(48, 54, 63, .8)
      }

      .bridge.open {
        box-shadow: 0 4px 24px rgba(0, 0, 0, .3)
      }

      .bridge .hdr {
        display: flex;
        align-items: center;
        padding: 12px 14px;
        gap: 10px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none
      }

      .bridge .dot {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        flex-shrink: 0;
        letter-spacing: -.5px
      }

      .native .dot {
        background: linear-gradient(135deg, rgba(35, 134, 54, .3), rgba(63, 185, 80, .15));
        color: var(--green);
        border: 1px solid rgba(63, 185, 80, .2)
      }

      .sdk .dot {
        background: linear-gradient(135deg, rgba(31, 111, 235, .3), rgba(88, 166, 255, .15));
        color: var(--blue);
        border: 1px solid rgba(88, 166, 255, .2)
      }

      .ios .dot {
        background: linear-gradient(135deg, rgba(210, 153, 34, .3), rgba(227, 179, 65, .15));
        color: var(--yellow);
        border: 1px solid rgba(227, 179, 65, .2)
      }

      .module .dot {
        background: linear-gradient(135deg, rgba(137, 87, 229, .3), rgba(188, 140, 255, .15));
        color: var(--purple);
        border: 1px solid rgba(188, 140, 255, .2)
      }

      .bridge .info {
        flex: 1;
        min-width: 0;
        overflow: hidden
      }

      .bridge .name {
        font-size: 13px;
        font-weight: 700;
        color: #e6edf3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }

      .bridge .desc {
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 1px
      }

      .bridge .tag {
        font-size: 8px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: .5px
      }

      .native .tag {
        background: rgba(63, 185, 80, .12);
        color: var(--green)
      }

      .sdk .tag {
        background: rgba(88, 166, 255, .12);
        color: var(--blue)
      }

      .ios .tag {
        background: rgba(227, 179, 65, .12);
        color: var(--yellow)
      }

      .module .tag {
        background: rgba(188, 140, 255, .12);
        color: var(--purple)
      }

      .bridge .arrow {
        color: var(--text-dim);
        font-size: 12px;
        transition: transform .2s;
        flex-shrink: 0
      }

      .bridge.open .arrow {
        transform: rotate(90deg)
      }

      .bridge .body {
        padding: 0 14px 14px;
        display: none
      }

      .bridge.open .body {
        display: block
      }

      .bridge .cls {
        font-size: 11px;
        color: var(--text-dim);
        font-family: 'SF Mono', Menlo, monospace;
        margin-bottom: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, .3);
        border-radius: 8px;
        word-break: break-all
      }

      .methods {
        display: flex;
        flex-wrap: wrap;
        gap: 4px
      }

      .methods span {
        font-size: 10px;
        font-family: 'SF Mono', Menlo, monospace;
        background: rgba(0, 0, 0, .3);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        padding: 4px 8px;
        color: var(--text-dim);
        transition: all .15s
      }

      .methods span:hover {
        color: #e6edf3;
        border-color: rgba(88, 166, 255, .3);
        background: rgba(88, 166, 255, .06)
      }

      .empty {
        text-align: center;
        padding: 48px 16px;
        color: var(--text-dim)
      }

      .empty .icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: .4
      }

      .empty p {
        font-size: 13px;
        line-height: 1.5
      }

      .footer {
        text-align: center;
        padding: 8px 16px 20px;
        font-size: 10px;
        color: var(--text-dim)
      }

      /* reduce transparency for accessibility */
      @media(prefers-reduced-transparency:reduce) {

        .glass,
        .stat,
        .bridge {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: #161b22
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>JavaScript Bridge Detector</h1>
        <div class="sub">Scanning all window.* for native JavaScript bridges</div>
      </div>
      <div class="stats">
        <div class="stat s-total">
          <div class="num" id="s-total">-</div>
          <div class="label">Total</div>
        </div>
        <div class="stat s-native">
          <div class="num" id="s-native">-</div>
          <div class="label">Native</div>
        </div>
        <div class="stat s-sdk">
          <div class="num" id="s-sdk">-</div>
          <div class="label">SDK</div>
        </div>
        <div class="stat s-other">
          <div class="num" id="s-other">-</div>
          <div class="label">Other</div>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="footer" id="footer"></div>
    </div>
    <script>
      var list = document.getElementById("list");
      var found = [];
      var counts = {
        native: 0,
        sdk: 0,
        ios: 0,
        module: 0
      };
      var t0 = performance.now();
      var all = Object.getOwnPropertyNames(window);
      var skipMethods = /^(getClass|hashCode|equals|toString|notify|notifyAll|wait)$/;
      for (var i = 0; i < all.length; i++) {
        var k = all[i];
        try {
          var v = window[k];
          if (!v || typeof v !== "object") continue;
          if (typeof v.getClass === "function") {
            var cls = "";
            try {
              cls = v.getClass().getName()
            } catch (e) {
              cls = "(restricted)"
            }
            var methods = [];
            for (var m in v) {
              try {
                if (typeof v[m] === "function" && !skipMethods.test(m)) methods.push(m)
              } catch (e) {}
            }
            found.push({
              name: k,
              type: "native",
              cls: cls,
              methods: methods,
              desc: methods.length + " method" + (methods.length !== 1 ? "s" : "")
            });
            counts.native++;
            continue;
          }
          if (k.indexOf("Wrapped") === 0 && typeof v.invoke === "function") {
            found.push({
              name: k,
              type: "sdk",
              cls: "via wrapModule(window, \"" + k.replace("Wrapped", "") + "\")",
              methods: ["invoke"],
              desc: "SDK bridge wrapper"
            });
            counts.sdk++;
            continue;
          }
          if (/Module$/.test(k) && k !== "GPUShaderModule" && k !== "SharedStorageAppendMethod") {
            var mm = [];
            for (var m in v) {
              try {
                if (typeof v[m] === "function") mm.push(m)
              } catch (e) {}
            }
            if (mm.length) {
              found.push({
                name: k,
                type: "module",
                cls: "",
                methods: mm,
                desc: mm.length + " method" + (mm.length !== 1 ? "s" : "")
              });
              counts.module++;
            }
          }
        } catch (e) {}
      }
      if (window.webkit && window.webkit.messageHandlers) {
        try {
          var handlers = Object.getOwnPropertyNames(window.webkit.messageHandlers);
          for (var i = 0; i < handlers.length; i++) {
            found.push({
              name: handlers[i],
              type: "ios",
              cls: "webkit.messageHandlers." + handlers[i],
              methods: ["postMessage"],
              desc: "iOS message handler"
            });
            counts.ios++;
          }
        } catch (e) {
          found.push({
            name: "messageHandlers",
            type: "ios",
            cls: "(cannot enumerate)",
            methods: [],
            desc: "iOS bridge detected"
          });
          counts.ios++;
        }
      }
      var elapsed = (performance.now() - t0).toFixed(1);
      document.getElementById("s-total").textContent = found.length;
      document.getElementById("s-native").textContent = counts.native;
      document.getElementById("s-sdk").textContent = counts.sdk;
      document.getElementById("s-other").textContent = counts.ios + counts.module;
      if (!found.length) {
        list.innerHTML = ' < div class = "empty" > < div class = "icon" > & #x1f50d; < /div>' + ' < p > No bridges detected. < br > Open this page inside a MiniApp container < br > ' + 'to see injected native bridges. < /p> < /div>';
      }
      var order = {
        native: 0,
        sdk: 1,
        ios: 2,
        module: 3
      };
      found.sort(function(a, b) {
        return order[a.type] - order[b.type]
      });
      var icons = {
        native: "JB",
        sdk: "W",
        ios: "✉",
        module: "?"
      };
      var labels = {
        native: "Android JavaBridge",
        sdk: "SDK Wrapper",
        ios: "iOS Handler",
        module: "Possible Bridge"
      };
      for (var i = 0; i < found.length; i++) {
        var f = found[i];
        var el = document.createElement("div");
        el.className = "bridge " + f.type;
        el.innerHTML = ' < div class = "hdr" > ' + ' < div class = "dot" > ' + icons[f.type] + ' < /div>' + ' < div class = "info" > ' + ' < div class = "name" > ' + f.name + ' < /div>' + ' < div class = "desc" > ' + f.desc + ' < /div>' + ' < /div>' + ' < div class = "tag" > ' + labels[f.type] + ' < /div>' + ' < div class = "arrow" > ▶ < /div>' + ' < /div>' + ' < div class = "body" > ' + (f.cls ? ' < div class = "cls" > ' + f.cls + ' < /div>' : '') + (f.methods.length ? ' < div class = "methods" > ' + f.methods.map(function(m){return ' < span > '+m+' < /span>'}).join('') + ' < /div>' : '') + ' < /div>';
          el.querySelector(".hdr").addEventListener("click", function() {
            this.parentElement.classList.toggle("open");
          }); list.appendChild(el);
        }
        document.getElementById("footer").textContent = "Scanned " + all.length + " properties in " + elapsed + "ms";
    </script>
  </body>
</html>
