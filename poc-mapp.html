<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Consent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:16px;font-size:13px}
pre{background:#111;border:1px solid #222;border-radius:8px;padding:10px;font-size:10px;white-space:pre-wrap;word-break:break-all;margin:8px 0;color:#aaa;max-height:300px;overflow-y:auto}
button{padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;width:100%;margin:4px 0}
.green{background:#00b14f}
.blue{background:#1565c0}
.red{background:#b71c1c}
.gray{background:#333;color:#aaa}
.ok{color:#66bb6a}
.err{color:#ef5350}
.info{color:#42a5f5}
select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:8px;font-size:12px;margin:4px 0}
</style>
</head>
<body>

<h2 style="color:#00b14f">Ask Consent — Bridge Test</h2>
<p style="color:#666;font-size:11px;margin-bottom:8px">IdentityModule.invoke("authorize") — does it prompt native consent?</p>

<select id="tile">
  <option value="4049b8b349984c898d3105ec90262845|https://grabtravel.grab.com/grab-sso">Hotel — 4049b8b3...</option>
  <option value="662ec9fe067e4326b6ae0105b7cf540b|https://grab.drivelah.sg">Drivelah — 662ec9fe...</option>
  <option value="57d555fb5aeb442bacd8b0683bc94404|https://miniapp-sample.grab.com">Poc — 57d555fb...</option>
  <option value="4547df38b94d47478062e8396479cef3|https://flutter.firsty.app/authorize/grab">Firsty — 4547df38...</option>
</select>

<button class="green" onclick="askConsent()">ASK CONSENT (native bridge)</button>
<button class="blue" onclick="askConsent('redirect')">ASK CONSENT (redirect mode)</button>
<button class="gray" onclick="checkBridge()">Check bridge</button>

<pre id="out">Ready. Tap "ASK CONSENT".</pre>

<script>
// SDK bridge runtime — verbatim from index.esm-D3z_6957.js
var SDK=(function(){
  var X={};
  function sub(fn){var d=false;return{isUnsubscribed:function(){return d},unsubscribe:function(){if(!d){fn();d=true}}}}
  function stream(s){return{subscribe:s,then:function(ok,fail){return new Promise(function(res,rej){try{var h=null,done=false;h=s({next:function(v){res(ok?ok(v):v);if(h)h.unsubscribe();done=true}});if(done&&h)h.unsubscribe()}catch(e){fail==null?rej(e):res(fail(e))}})}}}
  function cn(ctx,mod,fn){var id=0;return function(){var n="";while((n=mod+"_"+fn+"Callback_"+id)in ctx)id++;id++;return n}}
  function wc(ctx,o){return stream(function(obs){var s,nm=o.cf();ctx[nm]=function(r){var res=r.result===null?undefined:r.result;var err=r.error===null?undefined:r.error;if(obs&&obs.next)obs.next({result:res,error:err,status_code:r.status_code})};o.w(nm);s=sub(function(){ctx[nm]=undefined});return s})}
  X.env=function(w,m){return w[m]?"android":w.webkit&&w.webkit.messageHandlers&&w.webkit.messageHandlers[m]?"ios":undefined};
  X.wrap=function(w,m){w["Wrapped"+m]=(function(ctx,name,call){return{invoke:function(met,par){return wc(ctx,{cf:cn(ctx,name,met),w:function(cb){call({callback:cb,method:met,module:name,parameters:par||{}})}})}}})(w,m,function(msg){if(w[m]&&w[m][msg.method]instanceof Function)w[m][msg.method](JSON.stringify(msg));else if(w.webkit&&w.webkit.messageHandlers&&w.webkit.messageHandlers[m])w.webkit.messageHandlers[m].postMessage(msg);else throw new Error("No native bridge for "+m+"."+msg.method)})};
  return X
})();

var out=document.getElementById("out");
function print(cls,msg){out.innerHTML+='<span class="'+cls+'">'+msg+'</span>\n';out.scrollTop=out.scrollHeight}

// PKCE (from IdentityModule.generatePKCEArtifacts)
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return String.fromCharCode.apply(null,a)}
function b64u(s){return btoa(s).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_")}
async function sha256(s){return b64u(String.fromCharCode.apply(null,new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))))}

function checkBridge(){
  out.textContent="";
  var mods=["IdentityModule","ScopeModule","ContainerModule","CheckoutModule","NetworkModule","ProfileModule","LocationModule","StorageModule","PlatformModule","CameraModule","DeviceModule"];
  var found=0;
  mods.forEach(function(m){
    var e=SDK.env(window,m);
    if(e){found++;print("ok","[YES] "+m+" ("+e+")");if(!window["Wrapped"+m])SDK.wrap(window,m)}
    else{print("err","[---] "+m)}
  });
  print("info","\n"+found+"/"+mods.length+" bridges available");
  if(!SDK.env(window,"IdentityModule"))print("err","\nIdentityModule NOT found — native consent won't work.\nThis bridge is only available inside the Grab MiniApp container.")
}

async function askConsent(mode){
  out.textContent="";
  var parts=document.getElementById("tile").value.split("|");
  var clientId=parts[0],redirectUri=parts[1];

  // 1. Check bridge
  var env=SDK.env(window,"IdentityModule");
  print("info","IdentityModule bridge: "+(env||"NOT FOUND"));
  if(!env){
    print("err","No native IdentityModule bridge.");
    print("err","This only works inside the Grab MiniApp container.");
    print("info","\nTry opening via deeplink:");
    print("info","grab://open?screenType=MINIAPP&webviewUrl=<this_page_url>?client_id="+clientId);
    return
  }
  if(!window.WrappedIdentityModule)SDK.wrap(window,"IdentityModule");

  // 2. Generate PKCE
  var verifier=b64u(rnd(64));
  var pkce={
    nonce:b64u(rnd(16)),
    state:b64u(rnd(32)),
    codeVerifier:verifier,
    codeChallenge:await sha256(verifier),
    codeChallengeMethod:"S256"
  };
  print("info","PKCE generated");
  print("info","  state: "+pkce.state.substring(0,20)+"...");

  // 3. Build params (exact match: IdentityModule.performNativeAuthorization)
  var params={
    clientId:clientId,
    redirectUri:redirectUri,
    scope:"openid",
    nonce:pkce.nonce,
    state:pkce.state,
    codeChallenge:pkce.codeChallenge,
    codeChallengeMethod:pkce.codeChallengeMethod,
    responseMode:mode||"in_place"
  };

  print("info","\nInvoking IdentityModule.authorize...");
  print("info","  clientId: "+clientId);
  print("info","  redirectUri: "+redirectUri);
  print("info","  responseMode: "+(mode||"in_place"));
  print("info","\nWaiting for native consent dialog...\n");

  // 4. Invoke
  try{
    var r=await window.WrappedIdentityModule.invoke("authorize",params);

    print("info","Response received:");
    print("info","  status_code: "+r.status_code);

    if(r.status_code===200&&r.result){
      print("ok","\n=== CONSENT GRANTED ===");
      print("ok","code: "+r.result.code);
      print("ok","state: "+r.result.state);
      print("ok","code_verifier: "+pkce.codeVerifier);
      print("info","\nNext: exchange code at token endpoint");
    }else if(r.status_code===302){
      print("ok","\n=== 302 REDIRECT ===");
      print("info","Consent triggered a redirect (check redirect_uri for ?code=)");
    }else if(r.status_code===204){
      print("info","204 — consent not needed (already authorized?)");
    }else{
      print("err","\nstatus: "+r.status_code);
      print("err","error: "+(r.error||JSON.stringify(r)));
    }
  }catch(e){
    print("err","\nInvoke threw: "+e.message);
    print("info","\nThis likely means the native bridge exists but");
    print("info","the method is not supported or scope is denied.");
  }
}

// Auto-detect on load
checkBridge();
</script>
</body>
</html>
